[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slippage"
version = "0.1.0"
description = "Small, dependency-light pre-trade slippage / market-impact cost model (spread + √-law impact + delay), with a size-aware round-trip cost and capacity tooling."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[tool.setuptools]
packages = ["slippage"]
