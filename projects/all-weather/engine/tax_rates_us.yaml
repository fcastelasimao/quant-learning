# tax_rates_us.yaml — US FEDERAL top marginal rates on investment income.
#
# Year-keyed schedule consumed by engine/tax.py (TaxSchedule, bisect-by-date
# lookup). The applicable entry for any date is the one with the latest
# `effective` date <= that date. Querying a date before the earliest entry is
# an error (we do not extrapolate an unknown regime).
#
# Scope / caveats:
#   * US FEDERAL only. State income tax, AMT, and bracket phase-ins are NOT
#     modelled. Rates are the TOP marginal federal rates (highest bracket).
#   * `short_term_top` is the ordinary-income top rate. It applies to BOTH
#     short-term capital gains AND non-qualified (ordinary) dividends and bond
#     interest (e.g. TLT / TIP distributions). There is therefore no separate
#     "ordinary dividend" field — use short_term_top.
#   * `niit` is the Net Investment Income Tax surtax (ACA, 2013+). It is
#     ADDITIVE to the rate above for high earners (e.g. LT gains top = 0.20 +
#     0.038 NIIT = 0.238 effective). The schedule stores them separately so the
#     caller decides whether the NIIT threshold is met.
#   * The backtest window starts 2006-01-01; the earliest entry (2003) is the
#     JGTRRA regime that covers 2006-2012. Pre-2003 regimes are out of scope.
#
# Sources: Tax Foundation historical federal rate tables; IRS; ACA (NIIT);
#          OBBBA 2025 (TCJA individual-rate permanence). Last reviewed 2026-05-30.

meta:
  jurisdiction: "US federal, top marginal bracket"
  excludes: "state income tax, AMT, bracket phase-ins, 0%/15% lower LTCG tiers"
  sources:
    - "Tax Foundation historical federal individual income tax rate tables"
    - "IRS tax year inflation adjustments (incl. OBBBA 2026 amendments)"
    - "Affordable Care Act (NIIT, effective 2013-01-01)"
    - "One Big Beautiful Bill Act 2025 (made TCJA 37% top rate permanent)"
  last_reviewed: "2026-05-30"
  recheck_after: "2026-12-31"

schedule:
  # JGTRRA (effective 2003-05-06): 15% LTCG + qualified dividends introduced,
  # 35% top ordinary rate (Bush tax cuts). Keyed to 2003-01-01 as the regime
  # anchor; it correctly covers the 2006-2012 backtest period.
  - effective: 2003-01-01
    short_term_top: 0.35
    long_term_top: 0.15
    qualified_dividend_top: 0.15
    niit: 0.0

  # ATRA 2012 + ACA: top ordinary rate restored to 39.6%, LTCG/qualified-div
  # top rate to 20%, and the 3.8% NIIT surtax begins. All effective 2013-01-01.
  - effective: 2013-01-01
    short_term_top: 0.396
    long_term_top: 0.20
    qualified_dividend_top: 0.20
    niit: 0.038

  # TCJA (effective 2018-01-01): top ordinary rate cut 39.6% -> 37%. LTCG /
  # qualified-div top (20%) and NIIT (3.8%) unchanged. OBBBA 2025 made the 37%
  # top rate permanent, so this entry carries through 2026 and beyond unchanged.
  - effective: 2018-01-01
    short_term_top: 0.37
    long_term_top: 0.20
    qualified_dividend_top: 0.20
    niit: 0.038
